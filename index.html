    <title>GLT Church | God's Love Tabernacle International Church</title>

      name="description"

    <link rel="canonical" href="https://www.glt.church/" />

    <!--
      Icons. Order matters: browsers that support SVG icons take the first
      match, so the vector mark must come before the PNG fallbacks.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#257f18" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#257f18" />
    <meta name="apple-mobile-web-app-title" content="GLT Church" />
    <meta name="application-name" content="GLT Church" />

    <!--
      Link previews. WhatsApp, iMessage, Facebook, LinkedIn and Slack read this
      static HTML and never run JavaScript, so these tags must be correct here.
      All URLs are absolute - most scrapers ignore relative paths.
    -->

    <meta property="og:site_name" content="GLT Church" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:title" content="GLT Church | God's Love Tabernacle International Church" />

    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="GLT Church congregation in worship, with the GLT emblem and the words A People of God's Love."
    />
